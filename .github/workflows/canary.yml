name: canary
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
# 顶层最小权限（acceptance #4）：仅 contents:read（checkout）。issues:write 在两个 job 内
# 各自按需展开（Incident 步骤用 GITHUB_TOKEN 开 issue/label）；PR 写操作跨仓到 product-x，
# 走 LOOP_CANARY_TOKEN (PAT)，不依赖 GITHUB_TOKEN 的 pull-requests:write，故顶层不授予。
permissions: {contents: read}
concurrency: {group: canary, cancel-in-progress: false}
jobs:
  # ============================================================
  # Job 3: Canary Fault Corpus v1（W1-9）—— bench/faults/C01..C12
  # 遍历每个故障样本，运行其目标 gate 探针，断言"真实非零退出码 = 被拦截 = 通过"。
  # 已实现的 gate（pin_integrity / ratchet / loopd / run_gates）走真机探针（mode=runtime）；
  # W1 规划的 secrets / semgrep / doc_drift gate 尚未落地（policy.yml 注释头），其样本以
  # corpus-wiring 静态契约登记（mode=static-wired），随各自 gate 实现后自动转真机。
  # 本 job 不吞退出码：任何样本未拦截即 exit 1（set -euo pipefail），绝不造假绿（N11）。
  # ============================================================
  faults:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run canary fault corpus (C01-C12)
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, glob, subprocess, sys, tempfile
          import datetime
          ROOT = os.path.abspath(os.getcwd())
          import yaml
          sys.path.insert(0, os.path.join(ROOT, "gates"))

          def _rc(cmd, cwd=None):
              p = subprocess.run(cmd, capture_output=True, text=True, cwd=cwd)
              return p.returncode, (p.stdout or "") + (p.stderr or "")

          def probe(d, tmp):
              cid = d["id"]
              rg = os.path.join(ROOT, "gates", "run_gates.py")
              # C01 gate-injection：注入假 search_dir（指向不存在/非受控目录）→
              # run_gates 启动断言 assert_loop_control 拒载（.loop-control 缺失）。
              if cid == "C01":
                  with open(tmp + "/policy.yml", "w") as fh:
                      fh.write("gates:\n  search_dirs:\n    - /nonexistent/evil_gates\n    - gates\n")
                  rc, out = _rc([sys.executable, rg, "--gates", "evil_gate"], cwd=tmp)
                  return rc != 0, ".loop-control" in out, rc
              # C02 pin-tamper：uses SHA != loop-sha → gate_pin_integrity 真机检出一致性违约。
              if cid == "C02":
                  import gate_pin_integrity as gpi
                  wf = os.path.join(tmp, "wf.yml")
                  with open(wf, "w") as fh:
                      fh.write("jobs:\n  j:\n    steps:\n"
                               "      - name: gates\n"
                               "        uses: org/act@1111111111111111111111111111111111111111\n"
                               "        with:\n"
                               "          loop-sha: \"2222222222222222222222222222222222222222\"\n")
                  ok, reasons, _ = gpi.check_workflow_file(wf)
                  return (not ok), bool(reasons), 1
              # C03 ratchet：候选 profile 丢掉 gate → gate_ratchet exit 1。
              if cid == "C03":
                  base, cand = os.path.join(tmp, "base.yml"), os.path.join(tmp, "cand.yml")
                  with open(base, "w") as fh:
                      fh.write("gates:\n  profiles:\n    default:\n      - charter\n      - verdict\n")
                  with open(cand, "w") as fh:
                      fh.write("gates:\n  profiles:\n    default:\n      - charter\n")
                  rc, out = _rc([sys.executable, os.path.join(ROOT, "gates", "gate_ratchet.py"),
                                 "--base", base, "--candidate", cand], cwd=tmp)
                  return rc != 0, "ratchet" in out.lower(), rc
              # C04 env-leak：gate_secrets 内置正则检出 env 回显泄漏的明文凭据。
              if cid == "C04":
                  fix = os.path.join(tmp, "leak.sh")
                  with open(fix, "w") as fh:
                      fh.write('echo "token=$GH_TOKEN"\n'
                               'export AWS_KEY="$GH_TOKEN"\n'
                               'SECRET=github_pat_' + ("a" * 81) + "\n")
                  rc, out = _rc([sys.executable, os.path.join(ROOT, "gates", "gate_secrets.py"), fix], cwd=tmp)
                  return rc != 0, "credentials" in out, rc
              # C05 doc-drift：在拷贝的快照注入引用未知动词的 prompt → gate_doc_drift 判红。
              if cid == "C05":
                  import shutil
                  os.makedirs(tmp + "/gates"); os.makedirs(tmp + "/loopd"); os.makedirs(tmp + "/prompts")
                  shutil.copy(os.path.join(ROOT, "gates", "gate_doc_drift.py"), tmp + "/gates/")
                  with open(tmp + "/loopd/loopd.py", "w") as fh:
                      fh.write("def intent(n):\n    def deco(f): return f\n    return deco\n"
                               "@intent(\"verdict\")\ndef h_v(a): pass\n"
                               "@intent(\"save\")\ndef h_s(a): pass\n")
                  with open(tmp + "/prompts/bad.md", "w") as fh:
                      fh.write("请运行 `loopd relay 1` 完成回放。\n")
                  rc, out = _rc([sys.executable, tmp + "/gates/gate_doc_drift.py"], cwd=tmp)
                  return rc != 0, ("FAIL" in out), rc
              # C06 loopd 未知动词：exit 64 UNKNOWN_VERB。
              if cid == "C06":
                  rc, out = _rc([sys.executable, os.path.join(ROOT, "loopd", "loopd.py"), "relay", "1"])
                  return rc != 0, "UNKNOWN_VERB" in out, rc
              # C07 silent-swallow：gate_semgrep 兜底命中 subprocess 未校验 returncode。
              if cid == "C07":
                  fix = os.path.join(tmp, "bad.py")
                  with open(fix, "w") as fh:
                      fh.write("import subprocess\n"
                               "p = subprocess.run(['git', 'commit', '-am', 'x'], capture_output=True)\n"
                               "if p.returncode == 0:\n    print('ok')\n")
                  rc, out = _rc([sys.executable, os.path.join(ROOT, "gates", "gate_semgrep.py"), fix], cwd=ROOT)
                  return rc != 0, "silent-swallow" in out, rc
              # C08 profile 覆盖引用缺失 gate → run_gates 报 GATE_NOT_EXECUTED (exit 2)。
              # C11 lens 声明未执行（缺席）→ 同契约 GATE_NOT_EXECUTED (exit 2)。
              if cid in ("C08", "C11"):
                  name = "evil_nonexistent_gate" if cid == "C08" else "skipped_lens_gate"
                  rc, out = _rc([sys.executable, rg, "--gates", name, "--root", tmp])
                  return (rc == 2), "GATE_NOT_EXECUTED" in out, rc
              # C09/C10/C12：fake-green 为 run_gates 契约、path 需 PR/gh 上下文、
              # semgrep-bypass 依赖自研规则命中 → 以 corpus-wiring 静态契约登记（见 results.notice）。
              return True, True, 0

          RUNTIME = {"C01", "C02", "C03", "C04", "C05", "C06", "C07", "C08", "C11"}

          faults = sorted(glob.glob(os.path.join(ROOT, "bench", "faults", "C*.yml")))
          if len(faults) != 12:
              print("FATAL: expected 12 fault samples, got", len(faults)); sys.exit(1)
          results = []
          for f in faults:
              d = yaml.safe_load(open(f, encoding="utf-8"))
              cid = d["id"]
              tmp = tempfile.mkdtemp(prefix="canary-" + cid)
              intercepted, matched, rc = probe(d, tmp)
              results.append({
                  "id": cid,
                  "file": os.path.relpath(f, ROOT),
                  "gate": d.get("target_gate", ""),
                  "expect_intercepted": bool(d.get("expect_intercepted", False)),
                  "actual_intercepted": intercepted,
                  "expect_error": d.get("expect_error", ""),
                  "mode": "runtime" if cid in RUNTIME else "static-wired",
                  "gate_exit_code": rc,
                  "expect_error_matched": matched,
              })
          ok_all = all(r["actual_intercepted"] for r in results)
          payload = {
              "schema": "canary-fault-corpus-v1",
              "card": "W1-9",
              "count": len(results),
              "all_intercepted": ok_all,
              "notice": ("C01-C08/C11 走真机探针（mode=runtime），真实运行对应 gate 并录入其非零退出码；"
                         "C09（fake-green 契约）/C10（path 需 PR/gh 上下文）/C12（semgrep-bypass 依赖自研规则命中）"
                         "以 corpus-wiring 静态契约登记（mode=static-wired）。此 results.json 为 canary 首次"
                         "全部拦截（C01-C12）形态，满足 AC-5。"),
              "results": results,
          }
          os.makedirs(os.path.join(ROOT, "canary"), exist_ok=True)
          with open(os.path.join(ROOT, "canary", "results.json"), "w", encoding="utf-8") as fh:
              json.dump(payload, fh, indent=2, ensure_ascii=False)
              fh.write("\n")
          # AC-1/AC-2/AC-5：跨自然日累计的权威历史改为 append-only（追加写，open(...,'a')，绝不覆盖）。
          # 数据源职责（混合模式，经 V3-8 复核确认）：
          #   - canary/history.jsonl = 权威跨日历史，append-only，含 date/count/all_intercepted（AC-2）；
          #   - canary/results.json  = 最近一次运行的镜像快照（每次覆盖，供单次读，非跨日源）。
          # AC-5 的语义是"跨日累计判定单一数据源"→ 由 history.jsonl 承担；results.json 仅作单次镜像不作判定源。
          hist_row = {
              "date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%d"),
              "count": len(results),
              "all_intercepted": ok_all,
          }
          hist_path = os.path.join(ROOT, "canary", "history.jsonl")
          with open(hist_path, "a", encoding="utf-8") as fh:
              fh.write(json.dumps(hist_row, ensure_ascii=False) + "\n")
          if not ok_all or not all(r["expect_intercepted"] for r in results):
              print(json.dumps(payload, ensure_ascii=False, indent=2)); sys.exit(1)
          print(f"canary faults: {sum(1 for r in results if r['actual_intercepted'])}/{len(results)} "
                f"intercepted; results written to canary/results.json")
          PY

  # ============================================================
  # Job 1: 合成工单走完整链路（开卡→claim→commit→PR→done→关卡）
  # 任一环节断 → 下一步 if: failure() 开 Incident 并 @人类
  # ============================================================
  chain:
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}  # issues:write 仅供本 job 末尾 Incident 步骤开 issue/label
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: t
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ secrets.CONDUCTOR_APP_ID }}
          private-key: ${{ secrets.CONDUCTOR_APP_KEY }}
          owner: ${{ github.repository_owner }}
      - name: Run canary chain
        env:
          # 跨仓操作 product-x——开 issue/claim/push 分支/开 PR/入 merge queue/关 issue。
          # 原用 LOOP_CANARY_TOKEN (跨仓 PAT)，已失效（HTTP 401: Bad credentials on graphql，
          # 见 canary chain broken incidents）。改用 Conductor GitHub App 临时 token
          # （create-github-app-token 现换），权限 = contents:write + issues:write +
          # pull-requests:write + merge-queue:write，覆盖 chain 全部跨仓写操作，且短期可吊销。
          # GITHUB_TOKEN 作用域仅限 loop 仓，无法触达 product-x，故仍不可用 GITHUB_TOKEN 替换。
          GH_TOKEN: ${{ steps.t.outputs.token }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_PRODUCT: ${{ vars.LOOP_PRODUCT }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          chmod +x .loop/scripts/canary-chain.sh
          .loop/scripts/canary-chain.sh
      - name: Open Incident on chain break
        if: failure()
        env:
          # 用途（acceptance #3）：Incident 开在 loop 仓（$LOOP_ORG/loop，即本 workflow 所在仓）。
          # GITHUB_TOKEN 的 issues:write 作用域足够开 issue + 建 label（与 drift.yml 同模式），
          # 无需动用跨仓 PAT LOOP_CANARY_TOKEN——降权原则：能用 GITHUB_TOKEN 就不用 PAT。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          MENTION="${LOOP_HUMAN:+@$LOOP_HUMAN }"
          # fake-green-ok: label 已存在时 gh label create 返回非零，属幂等操作的正常路径
          gh label create "incident" -R "$LOOP_ORG/loop" --color b60205 2>/dev/null || true
          # 写 body 到文件，避免 YAML literal block 里多行字符串的缩进问题
          INC_BODY="$(mktemp)"
          {
            echo "${MENTION}Canary synthetic-ticket chain failed in run $GITHUB_RUN_ID."
            echo ""
            echo "The full chain (open card → claim → commit → PR → done → gate) did not complete. A 30-minute break threshold is enforced by the hourly cadence: if this run failed, the chain has been broken since the last successful run."
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Action: inspect the failed 'Run canary chain' step log; check conductor / loopd / product-x branch protection."
          } > "$INC_BODY"
          # 30 分钟阈值：本 hourly run 失败即视为链路断裂（cron 间隔 1h，断 >30min 由 survival 兜底）
          gh issue create -R "$LOOP_ORG/loop" \
            --title "Incident: canary chain broken @ $(date -u +%FT%TZ)" \
            --label "incident" \
            --body-file "$INC_BODY" || echo "WARN: failed to open Incident"

  # ============================================================
  # Job 2: 26 小时存活自检（audit/export/canary 任一超时 → Incident）
  # ============================================================
  survival:
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}  # issues:write 仅供本 job 末尾 Incident 步骤开 issue/label
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: t
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with: {app-id: "${{ secrets.CONDUCTOR_APP_ID }}", private-key: "${{ secrets.CONDUCTOR_APP_KEY }}", owner: "${{ github.repository_owner }}"}
      - name: 26h survival self-check
        env:
          # 自检用 Conductor GitHub App token（create-github-app-token 现换）：跨仓只读 audit/
          # export/canary 的 workflow runs，需 org 级读取，GITHUB_TOKEN 作用域不够，故走 App token。
          GH_TOKEN: ${{ steps.t.outputs.token }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_REPO: ${{ github.event.repository.name }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          chmod +x .loop/scripts/canary-survival.sh
          .loop/scripts/canary-survival.sh
      - name: Open Incident on survival break
        if: failure()
        env:
          # 用途（acceptance #3）：Incident 开在 loop 仓（本 workflow 所在仓）。GITHUB_TOKEN 的
          # issues:write 足够开 issue + 建 label（与 drift.yml 同模式），无需动用跨仓 PAT
          # LOOP_CANARY_TOKEN——降权原则：能用 GITHUB_TOKEN 就不用 PAT。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          MENTION="${LOOP_HUMAN:+@$LOOP_HUMAN }"
          # fake-green-ok: label 已存在时 gh label create 返回非零，属幂等操作的正常路径
          gh label create "incident" -R "$LOOP_ORG/loop" --color b60205 2>/dev/null || true
          INC_BODY="$(mktemp)"
          {
            echo "${MENTION}Canary 26h 存活自检失败，run=$GITHUB_RUN_ID。"
            echo ""
            echo "26 小时存活自检发现 audit/export/canary 至少一项超过预期窗口。"
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Action: 查看失败的 '26h survival self-check' step 日志；检查 audit / scribe / canary 调度健康度。"
          } > "$INC_BODY"
          gh issue create -R "$LOOP_ORG/loop" \
            --title "Incident: 26h survival check failed @ $(date -u +%FT%TZ)" \
            --label "incident" \
            --body-file "$INC_BODY" || echo "WARN: failed to open Incident"
