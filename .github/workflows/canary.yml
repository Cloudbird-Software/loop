name: canary
on:
  schedule: [{cron: "0 * * * *"}]
  workflow_dispatch:
# 顶层最小权限（acceptance #4）：仅 contents:read（checkout）。issues:write 在两个 job 内
# 各自按需展开（Incident 步骤用 GITHUB_TOKEN 开 issue/label）；PR 写操作跨仓到 product-x，
# 走 LOOP_CANARY_TOKEN (PAT)，不依赖 GITHUB_TOKEN 的 pull-requests:write，故顶层不授予。
permissions: {contents: read}
concurrency: {group: canary, cancel-in-progress: false}
jobs:
  # ============================================================
  # Job 1: 合成工单走完整链路（开卡→claim→commit→PR→done→关卡）
  # 任一环节断 → 下一步 if: failure() 开 Incident 并 @人类
  # ============================================================
  chain:
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}  # issues:write 仅供本 job 末尾 Incident 步骤开 issue/label
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Run canary chain
        env:
          # LOOP_CANARY_TOKEN 用途（acceptance #3）：跨仓操作 product-x——开 issue/claim/
          # push 分支/开 PR/入 merge queue/关 issue。GITHUB_TOKEN 作用域仅限 loop 仓，无法
          # 触达 product-x，故此处必须用可跨仓的 token，不能用 GITHUB_TOKEN 替换。
          # canary 走 merge queue（GraphQL enqueuePullRequest），不使用 admin merge；
          # 线上 ruleset 的 bypass_actors 为空，任何 token 都绕不过分支保护。
          # 真实风险只是"高权限 PAT 存为 repo secret"——按 docs/密钥清单.md 降权/轮换。
          GH_TOKEN: ${{ secrets.LOOP_CANARY_TOKEN }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_PRODUCT: ${{ vars.LOOP_PRODUCT }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          chmod +x .loop/scripts/canary-chain.sh
          .loop/scripts/canary-chain.sh
      - name: Open Incident on chain break
        if: failure()
        env:
          # 用途（acceptance #3）：Incident 开在 loop 仓（$LOOP_ORG/loop，即本 workflow 所在仓）。
          # GITHUB_TOKEN 的 issues:write 作用域足够开 issue + 建 label（与 drift.yml 同模式），
          # 无需动用跨仓 PAT LOOP_CANARY_TOKEN——降权原则：能用 GITHUB_TOKEN 就不用 PAT。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          MENTION="${LOOP_HUMAN:+@$LOOP_HUMAN }"
          # fake-green-ok: label 已存在时 gh label create 返回非零，属幂等操作的正常路径
          gh label create "incident" -R "$LOOP_ORG/loop" --color b60205 2>/dev/null || true
          # 写 body 到文件，避免 YAML literal block 里多行字符串的缩进问题
          INC_BODY="$(mktemp)"
          {
            echo "${MENTION}Canary synthetic-ticket chain failed in run $GITHUB_RUN_ID."
            echo ""
            echo "The full chain (open card → claim → commit → PR → done → gate) did not complete. A 30-minute break threshold is enforced by the hourly cadence: if this run failed, the chain has been broken since the last successful run."
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Action: inspect the failed 'Run canary chain' step log; check conductor / loopd / product-x branch protection."
          } > "$INC_BODY"
          # 30 分钟阈值：本 hourly run 失败即视为链路断裂（cron 间隔 1h，断 >30min 由 survival 兜底）
          gh issue create -R "$LOOP_ORG/loop" \
            --title "Incident: canary chain broken @ $(date -u +%FT%TZ)" \
            --label "incident" \
            --body-file "$INC_BODY" || echo "WARN: failed to open Incident"

  # ============================================================
  # Job 2: 26 小时存活自检（audit/export/canary 任一超时 → Incident）
  # ============================================================
  survival:
    runs-on: ubuntu-latest
    permissions: {contents: read, issues: write}  # issues:write 仅供本 job 末尾 Incident 步骤开 issue/label
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: t
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with: {app-id: "${{ secrets.CONDUCTOR_APP_ID }}", private-key: "${{ secrets.CONDUCTOR_APP_KEY }}", owner: "${{ github.repository_owner }}"}
      - name: 26h survival self-check
        env:
          # 自检用 Conductor GitHub App token（create-github-app-token 现换）：跨仓只读 audit/
          # export/canary 的 workflow runs，需 org 级读取，GITHUB_TOKEN 作用域不够，故走 App token。
          GH_TOKEN: ${{ steps.t.outputs.token }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_REPO: ${{ github.event.repository.name }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          chmod +x .loop/scripts/canary-survival.sh
          .loop/scripts/canary-survival.sh
      - name: Open Incident on survival break
        if: failure()
        env:
          # 用途（acceptance #3）：Incident 开在 loop 仓（本 workflow 所在仓）。GITHUB_TOKEN 的
          # issues:write 足够开 issue + 建 label（与 drift.yml 同模式），无需动用跨仓 PAT
          # LOOP_CANARY_TOKEN——降权原则：能用 GITHUB_TOKEN 就不用 PAT。
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_HUMAN: ${{ vars.LOOP_HUMAN }}
        run: |
          set -e
          MENTION="${LOOP_HUMAN:+@$LOOP_HUMAN }"
          # fake-green-ok: label 已存在时 gh label create 返回非零，属幂等操作的正常路径
          gh label create "incident" -R "$LOOP_ORG/loop" --color b60205 2>/dev/null || true
          INC_BODY="$(mktemp)"
          {
            echo "${MENTION}Canary 26h 存活自检失败，run=$GITHUB_RUN_ID。"
            echo ""
            echo "26 小时存活自检发现 audit/export/canary 至少一项超过预期窗口。"
            echo ""
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo ""
            echo "Action: 查看失败的 '26h survival self-check' step 日志；检查 audit / scribe / canary 调度健康度。"
          } > "$INC_BODY"
          gh issue create -R "$LOOP_ORG/loop" \
            --title "Incident: 26h survival check failed @ $(date -u +%FT%TZ)" \
            --label "incident" \
            --body-file "$INC_BODY" || echo "WARN: failed to open Incident"
