name: scribe
on:
  schedule: [{cron: "0 22,10 * * *"}]
  workflow_dispatch:
permissions: {contents: read, issues: write}
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: t
        uses: actions/create-github-app-token@v1
        with: {app-id: "${{ secrets.CONDUCTOR_APP_ID }}", private-key: "${{ secrets.CONDUCTOR_APP_KEY }}", owner: "${{ github.repository_owner }}"}
      - name: Export full snapshot
        env:
          GH_TOKEN: ${{ steps.t.outputs.token }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_PRODUCT: product-x
          JOURNAL_REPO: ${{ vars.JOURNAL_REPO }}
          JOURNAL_MIRROR_TOKEN: ${{ secrets.JOURNAL_MIRROR_TOKEN }}
        run: |
          set -e
          mkdir -p journal-snapshot
          # 全量导出 issues/PR/comments/reviews/runs/rule-suites
          gh issue list -R "$LOOP_ORG/$LOOP_PRODUCT" --state all --limit 1000 --json number,title,state,labels,createdAt,updatedAt,body > journal-snapshot/issues.json
          gh pr list -R "$LOOP_ORG/$LOOP_PRODUCT" --state all --limit 1000 --json number,title,state,createdAt,mergedAt,headRefName > journal-snapshot/prs.json
          gh api "/repos/$LOOP_ORG/$LOOP_PRODUCT/comments" --paginate > journal-snapshot/comments.json
          gh api "/repos/$LOOP_ORG/$LOOP_PRODUCT/pulls/comments" --paginate > journal-snapshot/pr-comments.json
          gh api "/repos/$LOOP_ORG/$LOOP_PRODUCT/actions/runs?per_page=100" > journal-snapshot/runs.json
          gh api "/orgs/$LOOP_ORG/rule-suites?per_page=100" > journal-snapshot/rule-suites.json 2>/dev/null || echo '[]' > journal-snapshot/rule-suites.json
          # TODO: 导出 reviews (gh pr view --json reviews 逐个 PR)
          # 生成零 LLM 日报（确定性字段）
          python3 conductor/scribe_report.py journal-snapshot/ > journal-snapshot/daily-report.md
          cat journal-snapshot/daily-report.md
      - name: Commit to journal repo
        env:
          GH_TOKEN: ${{ secrets.JOURNAL_MIRROR_TOKEN }}
          JOURNAL_REPO: ${{ vars.JOURNAL_REPO }}
        run: |
          # TODO: clone journal repo, copy snapshot, commit, push
          echo "TODO: push to $JOURNAL_REPO (second remote mirror)"
