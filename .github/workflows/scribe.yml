name: scribe
on:
  schedule: [{cron: "0 22,10 * * *"}]
  workflow_dispatch:
# 顶层最小权限：GITHUB_TOKEN 仅 checkout 需 contents:read；所有跨仓/API 写操作走 SCRIBE_GH_TOKEN (PAT)，
# 不依赖 GITHUB_TOKEN 的 issues:write，故顶层不授予（acceptance #4：最小化，按需在 job 级展开）。
permissions: {contents: read}
concurrency: {group: scribe, cancel-in-progress: false}
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: t
        run: |
          echo "token=${{ secrets.SCRIBE_GH_TOKEN }}" >> "$GITHUB_OUTPUT"
      - name: Export full snapshot
        env:
          GH_TOKEN: ${{ steps.t.outputs.token }}
          LOOP_ORG: ${{ github.repository_owner }}
          LOOP_PRODUCT: ${{ vars.LOOP_PRODUCT || 'product-x' }}
          JOURNAL_REPO: ${{ vars.JOURNAL_REPO }}
          SCRIBE_ALLOW_DEGRADED: ${{ vars.SCRIBE_ALLOW_DEGRADED }}
        run: |
          set -e
          test -n "$JOURNAL_REPO" || { echo "ERROR: vars.JOURNAL_REPO not set"; exit 1; }
          mkdir -p journal-snapshot
          : > journal-snapshot/DEGRADED.txt
          : > journal-snapshot/DEGRADED_INFO.txt
          echo "=== Export issues ==="
          gh issue list -R "$LOOP_ORG/$LOOP_PRODUCT" --state all --limit 1000 \
            --json number,title,state,labels,createdAt,updatedAt,body > journal-snapshot/issues.json
          echo "=== Export PRs ==="
          gh pr list -R "$LOOP_ORG/$LOOP_PRODUCT" --state all --limit 1000 \
            --json number,title,state,createdAt,mergedAt,headRefName > journal-snapshot/prs.json
          echo "=== Export issue comments ==="
          # 注意端点：/repos/{o}/{r}/comments 是 commit 评论（给 git blame 用的），
          # issue 评论在 /repos/{o}/{r}/issues/comments。旧版写错成 /comments，
          # 导致 journal 的 comments.json 一直是空的，E3 journal 还原无法找回被删评论。
          gh api "/repos/$LOOP_ORG/$LOOP_PRODUCT/issues/comments" --paginate > journal-snapshot/comments.json
          echo "=== Export PR review comments ==="
          gh api "/repos/$LOOP_ORG/$LOOP_PRODUCT/pulls/comments" --paginate > journal-snapshot/pr-comments.json
          echo "=== Export reviews (per-PR) ==="
          # 逐个 PR 拉取 reviews，合并成 reviews.json
          echo '[]' > journal-snapshot/reviews.json
          for pr_num in $(jq -r '.[].number' journal-snapshot/prs.json); do
            gh api "/repos/$LOOP_ORG/$LOOP_PRODUCT/pulls/$pr_num/reviews" --paginate 2>/dev/null \
              | jq --argjson pr "$pr_num" '[.[] | . + {pr_number: $pr}]' \
              >> journal-snapshot/reviews.tmp.json
          done
          if [ -f journal-snapshot/reviews.tmp.json ]; then
            jq -s 'add' journal-snapshot/reviews.tmp.json > journal-snapshot/reviews.json
            rm -f journal-snapshot/reviews.tmp.json
          fi
          echo "=== Export workflow runs (product-x) ==="
          gh api "/repos/$LOOP_ORG/$LOOP_PRODUCT/actions/runs?per_page=100" > journal-snapshot/runs.json
          echo "=== Export workflow runs (loop, control plane) ==="
          # loop 仓库的 runs 含 canary/scribe/drift 等；canary 字段依赖此导出
          if ! gh api "/repos/$LOOP_ORG/loop/actions/runs?per_page=100" > journal-snapshot/loop-runs.json 2>/dev/null; then
            echo '{"workflow_runs":[]}' > journal-snapshot/loop-runs.json
            echo "loop-runs" >> journal-snapshot/DEGRADED.txt
          fi
          echo "=== Export rule-suites (org) ==="
          if ! gh api "/orgs/$LOOP_ORG/rule-suites?per_page=100" > journal-snapshot/rule-suites.json 2>/dev/null; then
            echo '[]' > journal-snapshot/rule-suites.json
            echo "rule-suites" >> journal-snapshot/DEGRADED.txt
          fi
          echo "=== Fetch taps.log from journal repo ==="
          # 点击器每小时 push taps.log 到 journal/taps/YYYY-MM-DD.log；拉当日文件做 confirm_taps 统计
          TODAY=$(date -u +%Y-%m-%d)
          gh api "/repos/$JOURNAL_REPO/contents/taps/$TODAY.log" --jq '.content' 2>/dev/null \
            | base64 -d > journal-snapshot/taps.log 2>/dev/null \
            || { echo "" > journal-snapshot/taps.log; echo "taps.log (info: empty taps is normal)" >> journal-snapshot/DEGRADED_INFO.txt; }
          echo "=== Generate zero-LLM daily report ==="
          python3 conductor/scribe_report.py journal-snapshot/ > journal-snapshot/daily-report.md
          cat journal-snapshot/daily-report.md
          if [ -s journal-snapshot/DEGRADED_INFO.txt ]; then
            while IFS= read -r src; do
              echo "::notice::scribe 信息性 fallback: $src"
            done < journal-snapshot/DEGRADED_INFO.txt
          fi
          if [ -s journal-snapshot/DEGRADED.txt ]; then
            while IFS= read -r src; do
              echo "::warning::scribe 降级数据源: $src"
            done < journal-snapshot/DEGRADED.txt
            if [ "${SCRIBE_ALLOW_DEGRADED:-false}" != "true" ]; then
              exit 1
            fi
          fi
      - name: Commit snapshot to journal repo + push second remote
        env:
          GH_TOKEN: ${{ secrets.SCRIBE_GH_TOKEN }}
          JOURNAL_REPO: ${{ vars.JOURNAL_REPO }}
          JOURNAL_MIRROR_URL: ${{ vars.JOURNAL_MIRROR_URL }}
          LOOP_ORG: ${{ github.repository_owner }}
        run: |
          set -e
          test -n "$JOURNAL_REPO" || { echo "ERROR: vars.JOURNAL_REPO not set"; exit 1; }
          test -n "$GH_TOKEN"    || { echo "ERROR: secrets.SCRIBE_GH_TOKEN not set"; exit 1; }
          TODAY=$(date -u +%Y-%m-%d)
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          cd /tmp
          rm -rf journal-clone
          # 鉴权走 git credential helper：gh auth setup-git 读 GH_TOKEN 并为 github.com
          # 注入凭据。token 不再拼进克隆/推送 URL（旧版把 token 嵌入 remote URL，会让
          # token 出现在 remote URL / git config / 进程参数里，属密钥卫生问题）。
          gh auth setup-git
          JOURNAL_URL="https://github.com/${JOURNAL_REPO}.git"
          git clone --depth 1 "$JOURNAL_URL" journal-clone
          cd journal-clone
          # 按日期分目录
          EXPORT_DIR="exports/${TODAY}"
          mkdir -p "$EXPORT_DIR"
          # 拷贝快照（不含 daily-report，单独放一份在日期根）
          cp -r "${GITHUB_WORKSPACE}/journal-snapshot/"* "$EXPORT_DIR/"
          # 日报单放一份便于浏览
          mkdir -p "reports"
          cp "${GITHUB_WORKSPACE}/journal-snapshot/daily-report.md" "reports/${TODAY}-${TS}.md"
          git add -A
          git config user.name  "loop-scribe-bot"
          git config user.email "scribe-bot@users.noreply.github.com"
          git commit -m "scribe: export ${TODAY} ${TS}" || { echo "nothing to commit"; exit 0; }
          # 第一远端：journal 仓库本身（凭据已由 gh auth setup-git 注入，URL 不含 token）
          git push origin HEAD
          # 第二远端（镜像，可选）：地址来自变量，不硬编码；token 同样走 credential helper，
          # 不再注入 URL。镜像须与 journal 同样托管在 github.com（复用同一 GH_TOKEN 凭据）；
          # 若将来镜像换到非 github.com 主机，需为该 host 单独配置 credential helper。
          if [ -n "$JOURNAL_MIRROR_URL" ]; then
            git remote add mirror "$JOURNAL_MIRROR_URL" 2>/dev/null || git remote set-url mirror "$JOURNAL_MIRROR_URL"
            git push mirror HEAD
            echo "pushed to second remote (mirror)"
          else
            echo "JOURNAL_MIRROR_URL not set, skip second remote"
          fi
          echo "=== journal commit done: exports/${TODAY} @ ${TS} ==="
