name: nightly-rubric
on:
  schedule:
    # 每晚 02:00 UTC = 10:00 北京：promptfoo rubric 夜检（非阻塞）
    - cron: "0 2 * * *"
    # 每周五 06:23 UTC = 14:23 北京：产出本周 retro Finding（周五下午人还没下班）
    - cron: "23 6 * * 5"
  workflow_dispatch:
permissions: {contents: read, issues: write, actions: write}
concurrency: {group: nightly-rubric, cancel-in-progress: false}
jobs:
  # ============================================================
  # 夜检：LLM rubric（promptfoo，非阻塞；失败只开 Finding，不卡波次）
  # ============================================================
  promptfoo-rubric-nightly:
    if: ${{ github.event.schedule == '0 2 * * *' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: eval
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python
        uses: actions/setup-python@0b5e7485ae2cc8f5e1a81654d7a944f453e71b83 # v5.3.0
        with: {python-version: "3.11"}
      - name: Install promptfoo + deps
        run: |
          set -e
          python -m pip install --upgrade pip PyYAML --quiet
          npm install -g promptfoo
      - name: Run promptfoo llm-rubric
        env:
          LLM_GATEWAY_KEY: ${{ secrets.LLM_GATEWAY_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ ! -f promptfoo/promptfooconfig.yaml ]; then
            echo "::error::promptfoo config not scaffolded — see WAVE card"
            echo "promptfoo config not scaffolded — see WAVE card" >&2
            exit 1
          fi
          promptfoo eval -c promptfoo/promptfooconfig.yaml --filter-metadata rubric=true
      - name: On failure → open Finding issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            -R ${{ github.repository }} \
            --title "Rubric nightly failed: $(date -u +%F)" \
            --label finding --label rubric-nightly \
            --body "LLM rubric nightly failed. See run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            || echo "::warning::创建 Finding issue 失败"

  # ============================================================
  # 每周五 Retro：OPC-v4 P6 五问零 LLM 汇总 + plan-ops LLM 归因
  # ============================================================
  retro-friday:
    if: ${{ github.event.schedule == '23 6 * * 5' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: eval
    permissions: {contents: read, issues: write, actions: write}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: {fetch-depth: 200}  # 需要足够历史查 last_audited_sha diff
      - name: Setup Python
        uses: actions/setup-python@0b5e7485ae2cc8f5e1a81654d7a944f453e71b83 # v5.3.0
        with: {python-version: "3.11"}
      - name: Install deps
        run: python -m pip install PyYAML --quiet
      - name: Run conductor/retro.py（五问零 LLM 汇总 + Finding issue）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LOOP_ROOT: ${{ github.workspace }}
          LOOP_POLICY: ${{ github.workspace }}/policy.yml
          LOOP_REPO: ${{ github.event.repository.name }}
          LOOP_ORG: ${{ github.repository_owner }}
        run: |
          set -e
          python conductor/retro.py
      - name: Upload retro artifacts（JSON + 正文 + LLM attribution stub）
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf658082d78c9bdf267e # v4.5.0
        with:
          name: retro-artifacts
          path: |
            .loop/retro/retro_*W*.json
            .loop/retro/*_issue.md
            .loop/retro/llm_attribution_*.json
            .loop/retro/prev_action_items.json
          retention-days: 90
      - name: Repository dispatch → plan-ops（LLM 归因通道，adapter stub）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 以后 plan-ops sandbox 真实接口就绪后，把 body payload 替换成 HTTP POST
          # 目前仅打一个空事件（不阻塞）
          # fake-green-ok: plan-ops 归因通道是非阻塞的旁路事件，失败不应让 retro 作业红
          set +e
          WEEK=$(date -u +%GW%V)
          gh api repos/${{ github.repository }}/dispatches \
            -X POST \
            -f event_type=plan-ops-retro-attribution \
            -f "client_payload[week]=$WEEK" \
            -f "client_payload[adapter]=plan-ops" \
            -f "client_payload[status]=stub_pending" \
            || echo "plan-ops dispatch skipped (adapter stub; no fatal if network fails)"
