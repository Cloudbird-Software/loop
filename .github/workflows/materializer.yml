name: materializer
on:
  push:
    branches: [main]
    paths: ["waves/**"]
permissions: {contents: read}
jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: t
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with: {app-id: "${{ secrets.CONDUCTOR_APP_ID }}", private-key: "${{ secrets.CONDUCTOR_APP_KEY }}"}
      - run: python conductor/materialize.py waves/
        env: {GH_TOKEN: "${{ steps.t.outputs.token }}"}
