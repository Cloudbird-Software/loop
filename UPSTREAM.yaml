    degrade_path: "PR 关键路径退回 trufflehog --only-verified，密度下降但可阻断"
    note: "R11-3 回填；sha256 对应 release v8.16.0 资产 gitleaks_8.16.0_linux_x64.tar.gz，与 gitleaks_8.16.0_checksums.txt 交叉核对一致。"

