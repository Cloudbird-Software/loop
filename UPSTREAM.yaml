    degrade_path: "改用 ensure-sha-pinned-actions + 人工逐条钉 SHA"
    note: "R11-3 回填；sha256 对应 release v0.1.0 资产 pinact_linux_amd64.tar.gz，与 pinact_0.1.0_checksums.txt 交叉核对一致。"

