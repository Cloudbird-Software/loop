    note: "R11-3 回填；sha256 对应 release v3.70.0 资产 trufflehog_3.70.0_linux_amd64.tar.gz，与 trufflehog_3.70.0_checksums.txt 交叉核对一致。"

  # ── GitHub Actions（workflow uses 引用，钉到 40 位 SHA；R11-1 补登） ──
  - name: actions/checkout
    seam: gate
    kind: action
    pin: "v4.4.0"
    sha256: "11d5960a326750d5838078e36cf38b85af677262"   # commit SHA（action 引用即以此 SHA 钉）
    license: MIT
