    note: "R11-1 补登：gates.yml / pr-ci.yml / ci-security.yml 等所有 workflow 均引用；pin 为 tag，sha256 字段记录所钉 commit SHA（GitHub Actions 的钉法即用 SHA 而非二进制哈希）。"

