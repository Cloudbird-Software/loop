audit:
  shards_per_day: 2
  max_new_findings_per_day: 8
  min_confidence: 0.6
  require_evidence: true
  dedup: fingerprint            # sha256(lens + normalized_path + symbol + rule_id)
  auto_throttle: {window_days: 14, adopt_rate_floor: 0.35, stale_close_days: 21}
plan:
  max_cards_per_wave: 14
  value_vs_internal_ratio: 0.7
  auto_approve_tiers: [trivial]
  human_touch_budget: 3
execute:
  max_parallel_cards: 6          # 沙盒数可以远大于这个值
  max_diff_lines: {trivial: 300, standard: 600, critical: 400}
  max_cards_per_session: 6
  race_tiers: [critical]         # 影子实现
  sandbox_pool_min: 8
  sandbox:                       # R12-5: 复现沙盒执行环境约束
    timeout_sec: 120             # 单条 repro.cmd 超时
    memory_mb: 2048              # 内存上限
    cpu_shares: 512              # CPU 权重
    network: read_only           # 只读网络（可拉取但不可写生产仓）
    writable_paths: [/tmp]       # 仅允许写 /tmp（无生产仓库写权限）
upstream:
  min_age_days: 7
  trigger: on_wave_open          # ★不按周
  auto_tier: {seam_a: trivial, seam_d: trivial, seam_b: standard, checkers_or_workflows: critical}
license:
  allow: [MIT, Apache-2.0, BSD-2-Clause, BSD-3-Clause, ISC, MPL-2.0, Unlicense, CC0-1.0, PSF-2.0, Python-2.0]
review:
  # 强模型验收环（见 docs/强模型验收环.md）。本段是该环唯一的方向盘。
  enabled: true
  tiers: [standard, critical]    # trivial 卡不跑强模型验收（成本控制）
  max_reviews_per_day: 6         # Copilot CLI 在 Actions 里跑消耗 premium request
  min_confidence: 0.6            # 低于此值的 claim 由校验器直接丢弃
  required_check: false          # ★永不做 required check：模型不确定性不能卡合并线
  reproduce_required: true       # ★未被 REPRODUCED 的 claim 不得触发任何代码改动（CHARTER N7）
  heterogeneity_required: true   # 复现模型必须 != 提出 claim 的模型（CHARTER N6）
  arbitration_samples: 3         # 复现结果冲突时凑够几个样本才交 planner 仲裁
  harden_after_confirms: 2       # 同一 suggested_checker 被确认 N 次 → 强制转「写检查器」卡
  precision_floor: 0.5           # reviewer_model 的 claim 精度低于此值 → 自动降权/改路由
  min_samples_for_demotion: 10   # R12-7: 降权决策最小样本量；不足时打印 INSUFFICIENT_SAMPLES 不降权
  subjective_words:              # R12-1: 主观词表，命中且无可执行 repro 的 claim 一律拒收
    - 优雅
    - 清晰
    - 更好
    - 建议重构
    - 最佳实践
    - 我觉得
    - 可能
    - 似乎
    - 应该
    - 感觉
    - 大概
    - 建议考虑
    - 不够优雅
    - 可读性差
    - 代码味道
    - 坏味道
    - 理想情况下
    - 理论上
gates:
  # gates/run_gates.py 读取本段决定一个 profile 应当执行哪些 gate（R10-3）。
  # 不得偷偷缩小集合：新增 gate 时必须加进 default profile，否则等于静默跳过（F-A 根因）。
  timeout_default: 120           # 秒；单个 gate 超时即判失败
  timeouts:                      # 按 gate 名覆盖
    verdict: 180
  search_dirs:                   # gate 文件解析顺序（先到先得），三处都找不到才算缺席
    - gates
    - .loop/gates
    - ${LOOP_ROOT}/gates
  profiles:
    default:                     # loop 仓全集（与 settings/*-main-protection.json required_status_checks 对齐）
      - charter
      - diffsize
      - license
      - minage
      - paths
      - testown
      - upstream
      - verdict
      - lockdiff
      - heterogeneity
    strict:                      # 产品仓全集（含 conformance；LOOP.yml gates.profile: strict）
      - charter
      - diffsize
      - license
      - minage
      - paths
      - testown
      - upstream
      - verdict
      - lockdiff
      - heterogeneity
      - conformance
